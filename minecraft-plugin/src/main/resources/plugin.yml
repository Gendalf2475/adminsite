name: MajureLuckPermsBridge
version: "${version}"
main: dev.majure.adminbridge.MajureAdminBridgePlugin
api-version: "1.20"
depend:
  - LuckPerms
authors:
  - MAJURE
description: Connects MAJURE admin panel staff rank actions to LuckPerms.
commands:
  majurebridge:
    description: Manage the MAJURE LuckPerms bridge.
    usage: /majurebridge <reload|sync|poll>
    permission: majure.bridge.admin
permissions:
  majure.bridge.admin:
    description: Allows reloading and manually triggering the bridge.
    default: op
